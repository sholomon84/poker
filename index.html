<style>
*{box-sizing:border-box}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>if(!window.mqtt)document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"><\/script>')</script>
<script>
// ================== Карты и оценка рук ==================
const UI = typeof document !== 'undefined';
const SUITS = ['♠','♥','♦','♣'];
const RN = {10:'10',11:'J',12:'Q',13:'K',14:'A'};
const rn = r => RN[r] || String(r);
const cs = c => rn(c.r) + SUITS[c.s];
const key = c => c.r * 4 + c.s;
const HN = ['Старшая карта','Пара','Две пары','Сет','Стрит','Флеш','Фулл-хаус','Каре','Стрит-флеш'];
const B5 = 15 ** 5;

function newDeck(){ const d=[]; for(let s=0;s<4;s++) for(let r=2;r<=14;r++) d.push({r,s}); return d; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function eval5(c){
  const rs = c.map(x=>x.r).sort((a,b)=>b-a);
  const fl = c.every(x=>x.s===c[0].s);
  const cnt = {}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g = Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a] || b-a);
  let st = 0;
  if (g.length===5){ if (rs[0]-rs[4]===4) st=rs[0]; else if (rs[0]===14 && rs[1]===5) st=5; }
  let cat, t;
  if (st && fl){ cat=8; t=[st]; }
  else if (cnt[g[0]]===4){ cat=7; t=g; }
  else if (cnt[g[0]]===3 && cnt[g[1]]===2){ cat=6; t=g; }
  else if (fl){ cat=5; t=rs; }
  else if (st){ cat=4; t=[st]; }
  else if (cnt[g[0]]===3){ cat=3; t=g; }
  else if (cnt[g[0]]===2 && cnt[g[1]]===2){ cat=2; t=g; }
  else if (cnt[g[0]]===2){ cat=1; t=g; }
  else { cat=0; t=rs; }
  let v = cat; for (let i=0;i<5;i++) v = v*15 + (t[i]||0);
  return v;
}
const SKIP = []; for(let a=0;a<7;a++) for(let b=a+1;b<7;b++) SKIP.push([a,b]);
function best7(c){
  let bv=-1, bc=null;
  for (const [a,b] of SKIP){
    const f = c.filter((_,i)=>i!==a && i!==b);
    const v = eval5(f);
    if (v>bv){ bv=v; bc=f; }
  }
  return { v:bv, cards:bc, cat:Math.floor(bv/B5) };
}
function handName(b){
  if (b.cat===8 && Math.floor(b.v/15**4)%15===14) return 'Роял-флеш';
  return HN[b.cat];
}
function equity(hole, board, nOpp, iters){
  const known = new Set([...hole,...board].map(key));
  const rest = newDeck().filter(c=>!known.has(key(c)));
  let score = 0;
  for (let it=0; it<iters; it++){
    const d = rest.slice(); let idx = 0;
    const draw = () => { const j = idx + Math.floor(Math.random()*(d.length-idx)); [d[idx],d[j]]=[d[j],d[idx]]; return d[idx++]; };
    const b = board.slice(); while (b.length<5) b.push(draw());
    const my = best7(hole.concat(b)).v;
    let win = true, ties = 0;
    for (let o=0;o<nOpp;o++){
      const ov = best7([draw(),draw()].concat(b)).v;
      if (ov>my){ win=false; break; }
      if (ov===my) ties++;
    }
    if (win) score += 1/(ties+1);
  }
  return score/iters;
}

// ================== Состояние игры ==================
const BOT_NAMES = ['Анна','Борис','Вика','Гоша','Даша'];
const MAX_SEATS = 6;
const START_STACK = 1000, START_SB = 10, BLIND_UP_EVERY = 10;
let P=[], board=[], deck=[], dealer=-1, sb=START_SB, bb=START_SB*2, handNo=0;
let curBet=0, minRaise=0, toAct=-1, street=0, handOver=true, gameEnded=false, runout=false, gameMsg='';
let sbPos=-1, bbPos=-1, winners=new Set(), winKeys=new Set(), lastPot=0;
let delay = (fn, ms) => setTimeout(fn, ms);
let ALL_BOTS = false; // для автотеста

const N = () => P.length;
const canAct = p => !p.out && !p.folded && !p.allin;
const potSize = () => P.reduce((s,p)=>s+p.total,0);
function nextAlive(i){ for(let k=1;k<=N();k++){ const j=(i+k+N())%N(); if(!P[j].out) return j; } return -1; }
function nextCanAct(i){ for(let k=1;k<=N();k++){ const j=(i+k+N())%N(); if(canAct(P[j])) return j; } return -1; }
function isBot(i){ return ALL_BOTS || P[i].bot; }

function put(i, amt){
  const p=P[i]; const a=Math.max(0,Math.min(amt,p.stack));
  p.stack-=a; p.bet+=a; p.total+=a;
  if (p.stack===0) p.allin=true;
  return a;
}

// spec: [{name, bot, pid, local}]
function newGame(spec){
  if (!spec) spec=[{name:'Ты', local:true}, ...BOT_NAMES.slice(0,3).map(n=>({name:n+' (бот)', bot:true}))];
  P = spec.map(s=>({name:s.name, bot:!!s.bot, pid:s.pid||null, local:!!s.local, stack:START_STACK, hand:[], folded:false, allin:false, out:false, bet:0, total:0, acted:false, last:'', result:''}));
  dealer=-1; handNo=0; sb=START_SB; bb=START_SB*2; gameEnded=false; gameMsg='';
  if (UI) $('log').innerHTML='';
  startHand();
}

function startHand(){
  P.forEach(p=>{ if (p.stack<=0) p.out=true; });
  const alive=P.filter(p=>!p.out);
  const humans=P.filter(p=>!p.bot);
  if (!ALL_BOTS && humans.length && !alive.some(p=>!p.bot)){
    return gameOver(humans.length===1 && humans[0].local ? 'Ты выбыл из игры 😔' : 'Все игроки выбыли — победили боты 🤖');
  }
  if (alive.length===1){
    const w=alive[0];
    return gameOver(w.bot ? `${w.name} забрал все фишки` : `${w.local?'Ты обыграл всех':w.name+' забирает все фишки'}! 🏆`);
  }
  handNo++;
  if (handNo>1 && (handNo-1)%BLIND_UP_EVERY===0){ sb*=2; bb*=2; log(`Блайнды выросли: ${sb}/${bb}`,'h'); }
  dealer = nextAlive(dealer);
  P.forEach(p=>{ p.hand=[]; p.folded=p.out; p.allin=false; p.bet=0; p.total=0; p.acted=false; p.last=''; p.result=''; p.best=null; });
  board=[]; deck=shuffle(newDeck()); winners=new Set(); winKeys=new Set();
  handOver=false; street=0; runout=false; lastPot=0;
  if (alive.length===2){ sbPos=dealer; bbPos=nextAlive(dealer); }
  else { sbPos=nextAlive(dealer); bbPos=nextAlive(sbPos); }
  put(sbPos,sb); P[sbPos].last='SB '+P[sbPos].bet;
  put(bbPos,bb); P[bbPos].last='BB '+P[bbPos].bet;
  curBet=bb; minRaise=bb;
  for (let r=0;r<2;r++) for (let k=1;k<=N();k++){ const j=(dealer+k)%N(); if(!P[j].out) P[j].hand.push(deck.pop()); }
  log(`— Раздача #${handNo}. Дилер: ${P[dealer].name}. Блайнды ${sb}/${bb}`,'h');
  toAct = bbPos;
  advance();
}

function advance(){
  const live = P.filter(p=>!p.out && !p.folded);
  if (live.length===1) return winAll(live[0]);
  const ca = P.filter(canAct);
  const done = ca.length===0 || (ca.length===1 && ca[0].bet>=curBet) || ca.every(p=>p.acted && p.bet===curBet);
  if (done){ toAct=-1; render(); delay(nextStreet, 600); return; }
  toAct = nextCanAct(toAct);
  render();
  if (isBot(toAct)) { const me=toAct, h=handNo; delay(()=>{ if(toAct===me && handNo===h && !handOver) botMove(me); }, 750); }
}

function act(i, type, to){
  if (handOver || toAct!==i) return;
  const p=P[i]; const call=curBet-p.bet;
  if (type==='fold'){ p.folded=true; p.last='Фолд'; log(`${p.name}: фолд`); }
  else if (type==='call' || (type==='raise' && to<=curBet)){
    if (call<=0){ p.last='Чек'; log(`${p.name}: чек`); }
    else { const a=put(i,call); p.last = p.allin ? `Олл-ин ${p.bet}` : `Колл ${a}`; log(`${p.name}: ${p.allin?'олл-ин, колл':'колл'} ${a}`); }
  } else {
    to = Math.min(to, p.bet+p.stack);
    const prev=curBet; put(i, to-p.bet);
    if (p.bet>prev){
      const inc=p.bet-prev; if (inc>=minRaise) minRaise=inc;
      curBet=p.bet;
      P.forEach((q,j)=>{ if (j!==i && canAct(q)) q.acted=false; });
    }
    p.last = p.allin ? `Олл-ин ${p.bet}` : `${prev===0?'Бет':'Рейз до'} ${p.bet}`;
    log(`${p.name}: ${p.allin?'олл-ин':(prev===0?'бет':'рейз до')} ${p.bet}`);
  }
  p.acted=true;
  advance();
}

function nextStreet(){
  if (handOver) return;
  P.forEach(p=>{ p.bet=0; p.acted=false; if (canAct(p)) p.last=''; });
  curBet=0; minRaise=bb;
  if (street===3) return showdown();
  street++;
  deck.pop();
  if (street===1) board.push(deck.pop(),deck.pop(),deck.pop()); else board.push(deck.pop());
  log(`${['','Флоп','Тёрн','Ривер'][street]}: ${board.map(cs).join(' ')}`,'h');
  if (P.filter(canAct).length<=1){ runout=true; render(); delay(nextStreet, 1100); return; }
  toAct = dealer;
  advance();
}

function winAll(p){
  const pot=potSize(); lastPot=pot;
  p.stack+=pot; winners.add(P.indexOf(p)); p.result=`+${pot - p.total}`;
  log(`${p.name} забирает банк ${pot} (все сбросили)`,'h');
  endHand();
}

function showdown(){
  street=4; lastPot=potSize();
  const live=P.filter(p=>!p.out && !p.folded);
  live.forEach(p=>{ p.best=best7(p.hand.concat(board)); });
  const levels=[...new Set(P.map(p=>p.total).filter(x=>x>0))].sort((a,b)=>a-b);
  const won=P.map(()=>0); let prev=0;
  for (const L of levels){
    let amt=0; P.forEach(p=>{ amt += Math.min(p.total,L)-Math.min(p.total,prev); });
    let elig=live.filter(p=>p.total>=L); if (!elig.length) elig=live;
    const bv=Math.max(...elig.map(p=>p.best.v));
    const w=elig.filter(p=>p.best.v===bv);
    const share=Math.floor(amt/w.length); let rem=amt-share*w.length;
    w.sort((a,b)=>((P.indexOf(a)-dealer-1+N())%N())-((P.indexOf(b)-dealer-1+N())%N()));
    w.forEach(p=>{ const j=P.indexOf(p); won[j]+=share+(rem>0?1:0); if(rem>0) rem--; });
    prev=L;
  }
  live.forEach(p=>log(`${p.name}: ${p.hand.map(cs).join(' ')} — ${handName(p.best)}`));
  let top=null;
  P.forEach((p,j)=>{
    if (won[j]>0){
      p.stack+=won[j];
      const net=won[j]-p.total;
      if (net>0 || (live.length>1 && net>=0)) winners.add(j);
      p.result = net>0 ? `+${net} · ${handName(p.best)}` : (net===0 ? `возврат · ${handName(p.best)}` : `${handName(p.best)}`);
      if (!top || p.best.v>top.best.v) top=p;
      log(`${p.name} получает ${won[j]}`,'h');
    } else if (!p.folded && !p.out){ p.result=handName(p.best); }
  });
  if (top) top.best.cards.forEach(c=>winKeys.add(key(c)));
  endHand();
}

function endHand(){
  handOver=true; toAct=-1;
  if (ALL_BOTS) { checkChips(); return; }
  render();
}

// ================== Боты ==================
function botMove(i){
  const p=P[i];
  const nOpp=P.filter((q,j)=>j!==i && !q.out && !q.folded).length;
  const eq=equity(p.hand, board, nOpp, ALL_BOTS?60:260);
  const call=Math.min(curBet-p.bet, p.stack);
  const pot=potSize();
  const r=Math.random();
  const fair=1/(nOpp+1);
  const othersCanAct=P.some((q,j)=>j!==i && canAct(q));
  const raiseTo=f=>Math.min(curBet+Math.max(minRaise, Math.round(pot*f/bb)*bb), p.bet+p.stack);
  if (call<=0){
    if (othersCanAct && (eq>fair+(1-fair)*0.35 || (eq>fair*1.15 && r<0.3) || r<0.06)) return act(i,'raise',raiseTo(0.5+r*0.3));
    return act(i,'call');
  }
  const potOdds=call/(pot+call);
  if (othersCanAct && p.stack>call && ((eq>fair+(1-fair)*0.5 && r<0.6) || r<0.03)) return act(i,'raise',raiseTo(0.6+r*0.4));
  if (eq>=potOdds*0.9 || r<0.04) return act(i,'call');
  return act(i,'fold');
}

function model(i){
  const me=P[i], myTurn=!handOver && toAct===i;
  const call=Math.max(0,Math.min(curBet-me.bet, me.stack));
  const maxTo=me.bet+me.stack;
  const othersCanAct=P.some((q,j)=>j!==i && canAct(q));
  let msg;
  if (gameEnded) msg=gameMsg;
  else if (handOver) msg = winners.has(i) ? 'Ты выиграл банк! 🎉' : 'Раздача окончена';
  else if (me.out) msg = 'Ты выбыл — смотри, как играют другие';
  else if (myTurn) msg = call>0 ? `Твой ход. Чтобы остаться, нужно доставить ${call}` : 'Твой ход';
  else msg = toAct>=0 ? `Ходит ${P[toAct].name}…` : '…';
  const wk = street===4;
  const opp=[];
  for (let k=1;k<N();k++){
    const j=(i+k)%N(), p=P[j];
    opp.push({n:p.name, st:p.stack, l:p.out?'Выбыл':(p.result||p.last), b:p.bet, f:p.folded||p.out, a:toAct===j && !handOver, w:winners.has(j), d:dealer===j,
      c: ((street===4||runout) && !p.folded && !p.out) ? p.hand.map(c=>[c.r,c.s]) : null});
  }
  return {
    h:handNo, s:street, cb:curBet, call, maxTo, minTo:Math.min(curBet+minRaise, maxTo),
    canRaise: myTurn && othersCanAct && me.stack>call, myTurn, handOver, gameEnded, msg,
    pot: handOver && lastPot ? lastPot : potSize(), sb, bb, name:me.name,
    stack:me.stack, bet:me.bet, out:me.out, folded:me.folded, result:me.result||me.last,
    dealer: dealer===i, win: winners.has(i),
    hand: me.hand.map(c=>[c.r,c.s, wk && winKeys.has(key(c))?1:0]),
    board: board.map(c=>[c.r,c.s, winKeys.has(key(c))?1:0]),
    opp
  };
}

function publishTo(pid, obj){
  if (!tClient || !tClient.connected) return;

function lobbyState(pid){
  const me=lobby.find(p=>p.pid===pid);
  return {pre:true, me: me?me.name:'', players: lobby.map(p=>p.name), bots: botsWanted, canStart: Math.max(lobby.length,1)+botsWanted>=2 && lobby.length>0};
}
function syncPhones(force){
  if (PHONE || !tClient || !tClient.connected) return;
  const targets = new Set();
  if (!gameStarted) lobby.forEach(p=>targets.add(p.pid));
  else P.forEach(p=>{ if (p.pid) targets.add(p.pid); });
  targets.forEach(pid=>{
    let obj;
    if (!gameStarted) obj={k:'st', m:lobbyState(pid)};
    else { const i=P.findIndex(p=>p.pid===pid); obj={k:'st', m:model(i)}; }
    const s=JSON.stringify(obj);
    if (!force && lastSentTo[pid]===s) return;
    lastSentTo[pid]=s;
    publishTo(pid, obj);
  });
}
function onUp(d){
  if (!d || typeof d!=='object' || typeof d.id!=='string' || d.id.length>40) return;
  const pid=d.id, name=String(d.name||'').trim().slice(0,14) || 'Игрок';
  const wasOnline = online(pid);
  seen[pid]=Date.now();
  if (!gameStarted){
    const ex=lobby.find(p=>p.pid===pid);
    if (ex){ if (ex.name!==name){ ex.name=name; } }
    else if (lobby.length < MAX_SEATS) lobby.push({pid, name});
    else { publishTo(pid, {k:'st', m:{full:true, msg:'За столом нет свободных мест'}}); return; }
    renderLobby();
    if (d.k==='act' && d.a && d.a.type==='start') startGame();
    syncPhones(!wasOnline || d.k==='hello');
    return;
  }
  const i=P.findIndex(p=>p.pid===pid);
  if (i<0){ publishTo(pid, {k:'st', m:{full:true, msg:'Игра за этим столом уже идёт. Дождись новой игры'}}); return; }
  if (!wasOnline){ render(); renderLobby(); }
  if (d.k==='hello' || !wasOnline) { lastSentTo[pid]=''; }
  if (d.k==='act') onPhoneAction(i, d.a);
  syncPhones(false);
}
function onPhoneAction(i, a){
  if (!a || typeof a!=='object') return;
  if (a.type==='new'){ if (gameEnded) backToLobby(); return; }
  if (a.type==='next'){ if (handOver && !gameEnded && a.h===handNo) startHand(); return; }
  if (!['fold','call','raise'].includes(a.type)) return;
  if (handOver || toAct!==i || a.h!==handNo || a.s!==street || a.cb!==curBet){ lastSentTo[P[i].pid]=''; syncPhones(false); return; }
  act(i, a.type, Math.round(+a.to||0));
}
function mqttConnect(i, onOk, onFail){
  let done=false;
  const c = mqtt.connect(BROKERS[i], {clientId:'hp'+Math.random().toString(36).slice(2,10), connectTimeout:6000, reconnectPeriod:2000, keepalive:20, clean:true});
  const t=setTimeout(()=>{ if(!done){ done=true; try{c.end(true);}catch(e){} onFail(); } }, 7000);
  c.on('connect', ()=>{ if(!done){ done=true; clearTimeout(t); onOk(c); } });
  c.on('error', ()=>{});
  return c;
}

function bestOf(cards){
  if (cards.length===5) return {v:eval5(cards), cards};
  let best={v:-1,cards:null};
  const n=cards.length, pick=[];
  (function rec(start){
    if (pick.length===5){ const f=pick.map(i=>cards[i]); const v=eval5(f); if (v>best.v) best={v,cards:f}; return; }
    for (let i=start;i<n;i++){ pick.push(i); rec(i+1); pick.pop(); }
  })(0);
  return best;
}
function describeHand(hole, board){
  const keysOf = (cs, ranks) => new Set(cs.filter(c=>!ranks || ranks.includes(c.r)).map(key));
  if (board.length<3){
    const [a,b]=hole;
    if (a.r===b.r) return {text:`Пара ${R_GEN[a.r]}`, keys:keysOf(hole)};
    const hi=a.r>b.r?a:b;
    return {text:`Старшая карта — ${R_ONE[hi.r]}`, keys:new Set([key(hi)])};
  }
  const b=bestOf(hole.concat(board));
  const cat=Math.floor(b.v/B5), t=[0,1,2,3,4].map(i=>Math.floor(b.v/15**(4-i))%15);
  let text, ranks=null;
  switch(cat){
    case 0: text=`Старшая карта — ${R_ONE[t[0]]}`; ranks=[t[0]]; break;
    case 1: text=`Пара ${R_GEN[t[0]]}`; ranks=[t[0]]; break;
    case 2: text=`Две пары: ${R_PL[t[0]]} и ${R_PL[t[1]]}`; ranks=[t[0],t[1]]; break;
    case 3: text=`Сет ${R_GEN[t[0]]}`; ranks=[t[0]]; break;
    case 4: text=`Стрит до ${R_TO[t[0]]}`; break;
    case 5: text=`Флеш ${SUITS[b.cards[0].s]}`; break;
    case 6: text=`Фулл-хаус: ${R_PL[t[0]]} и ${R_PL[t[1]]}`; break;
    case 7: text=`Каре ${R_GEN[t[0]]}`; ranks=[t[0]]; break;
    default: text = t[0]===14 ? 'Роял-флеш!' : `Стрит-флеш до ${R_TO[t[0]]}`;
  }
  const keys=keysOf(b.cards, ranks);
  const holeKeys=new Set(hole.map(key));
  if (cat>0 && ![...keys].some(k=>holeKeys.has(k))) text+=' (на столе — она у всех)';
  return {text, keys};
}
const HINT={combo:false, eq:false};
const VIEW={cards:false, table:false}; let peek=false;
try{
  HINT.combo=localStorage.getItem('hp_combo')==='1'; HINT.eq=localStorage.getItem('hp_eq')==='1';

function paintToggles(){
  if (!UI) return;
  $('tCombo').classList.toggle('on', HINT.combo);
  $('tEq').classList.toggle('on', HINT.eq);
  $('tHideCards').classList.toggle('on', VIEW.cards);

let eqCache={k:'', v:null};
function showEq(hole, board, nOpp){
  const el=$('pEq');
  const k=hole.concat(board).map(key).join(',')+'|'+nOpp;
  const paint=v=>{
    const p=Math.round(v*100);
    el.innerHTML=`Шанс на победу: <b style="color:${p>=50?'#4cff8f':p>=25?'#ffd54a':'#ff8a7a'}">${p}%</b>` + (nOpp>1?` <span style="opacity:.7">(против ${nOpp})</span>`:'');
  };
  if (eqCache.k===k){ if (eqCache.v!=null) paint(eqCache.v); else el.textContent='Шанс на победу: считаю…'; return; }
  eqCache={k, v:null};
  el.textContent='Шанс на победу: считаю…';
  setTimeout(()=>{ if (eqCache.k!==k) return; const v=equity(hole, board, nOpp, 800); eqCache.v=v; if (eqCache.k===k && HINT.eq) paint(v); }, 30);
}
function renderHints(m){
  const hole=m.hand.map(toCard), board=m.board.map(toCard);
  const active = !m.out && !m.folded && hole.length===2;
  let keys=new Set();
  $('pCombo').textContent='';
  $('pEq').textContent='';
  if (HINT.combo && active){
    const d=describeHand(hole, board);
    $('pCombo').textContent='🃏 '+d.text;
    if (m.s!==4) keys=d.keys;
  }
  const nOpp=m.opp.filter(o=>!o.f).length;
  if (HINT.eq && active && !m.handOver && nOpp>0) showEq(hole, board, nOpp);
  return keys;
}

let pClient=null, pCode='', pm=null, pmSeen=0, myId='', myName='';
function phoneShow(view){ ['pJoin','pLobby','pGame'].forEach(id=>$(id).style.display = id===view ? 'block':'none'); }
function phoneSend(type, to){
  if (!pClient || !pClient.connected) return;
  if (type!=='start' && type!=='new' && !cm) return;
  const c=cm||{};
  pClient.publish(TOPIC(pCode)+'/up', JSON.stringify({k:'act', id:myId, name:myName, a:{type, to:to||0, h:c.h, s:c.s, cb:c.cb}}));
  if (['fold','call','raise','next'].includes(type)){
    $('actRow').style.display='none'; $('raiseRow').style.display='none'; $('bNext').style.display='none';
    $('msg').textContent='Отправлено…';
  }
}
function renderPhone(){
  const m=pm;
  if (!myName){ phoneShow('pJoin'); ['actRow','raiseRow','bNext'].forEach(id=>$(id).style.display='none'); $('msg').textContent=''; return; }
  if (!m){ phoneShow(null); $('msg').textContent='Подключаюсь к столу…'; return; }
  if (m.full){ phoneShow(null); ['actRow','raiseRow','bNext'].forEach(id=>$(id).style.display='none'); $('msg').textContent=m.msg; return; }
  if (m.pre){
    phoneShow('pLobby');
    $('info').textContent='Холдем · ожидание игроков';
    $('pLobbyMe').textContent = `Ты за столом как «${myName}»`;
    setHTML($('pLobbyList'), m.players.map(n=>`<div class="pl"><span>📱 ${esc(n)}</span>${n===m.me?'<span class="st">это ты</span>':''}</div>`).join('') + (m.bots?`<div class="pl"><span>🤖 Ботов: ${m.bots}</span></div>`:''));
    ['actRow','raiseRow'].forEach(id=>$(id).style.display='none');
    $('msg').textContent = 'Ждём, пока все сядут за стол';
    $('bNext').textContent='▶ Начать игру'; $('bNext').style.display='inline-block'; $('bNext').disabled=!m.canStart;
    return;
  }
  $('bNext').disabled=false;
  phoneShow('pGame');
  $('info').textContent = `${m.name} · Раздача #${m.h} · Блайнды ${m.sb}/${m.bb}`;
  setHTML($('pOpps'), m.opp.map(o=>`<div class="opp${o.a?' active':''}${o.f?' folded':''}${o.w?' winner':''}">
     <div class="name">${esc(o.n)}${o.d?'<span class="badge">D</span>':''}</div><div class="stack">${o.st}</div>
     <div class="status">${esc(o.l||'')}${o.b>0?` · ${o.b}`:''}</div>
     ${o.c?`<div class="cards" style="display:flex;gap:2px;justify-content:center">${o.c.map(a=>cardHTML(toCard(a))).join('')}</div>`:''}
   </div>`).join(''));
  const conceal = VIEW.cards && !peek && !m.out && m.s!==4;
  document.querySelector('.pMe').classList.toggle('concealed', conceal);
  $('peekHint').style.display = conceal && m.hand.length ? 'block' : 'none';
  const hk = conceal ? new Set() : renderHints(m);
  let bh=''; for (let i=0;i<5;i++) bh+= m.board[i] ? cardHTML(toCard(m.board[i]),false,m.board[i][2],hk.has(key(toCard(m.board[i])))) : cardHTML(null);
  setHTML($('pBoard'), bh);
  $('pPot').textContent='Банк: '+m.pot;
  setHTML($('pHand'), m.out ? '' : m.hand.map(a=>cardHTML(toCard(a),conceal,a[2],hk.has(key(toCard(a))))).join(''));
  $('pHand').style.opacity = m.folded && !m.out ? .4 : 1;
  $('pStack').innerHTML = `${m.stack} фишек${m.bet>0?` · ставка ${m.bet}`:''}${m.dealer?' <span class="badge">D</span>':''}`;
  $('pResult').textContent = m.result||'';
  renderControls(m, true);
  $('msg').textContent = m.msg;
  if (m.gameEnded){ $('bNext').style.display='inline-block'; $('bNext').textContent='Новая игра'; }
  else { $('bNext').style.display = m.handOver ? 'inline-block' : 'none'; $('bNext').textContent='Следующая раздача'; }
}
function initPhone(code, bi){
  PHONE=true; document.body.classList.add('phone');
  $('pExtra').style.display='block';
  pCode=code;
  try{ myId=localStorage.getItem('hp_id')||''; myName=localStorage.getItem('hp_name')||''; }catch(e){}
  if (!myId){ myId='u'+Math.random().toString(36).slice(2,12); try{ localStorage.setItem('hp_id', myId); }catch(e){} }
  $('pName').value=myName;
  const conn = t => { $('pConn').textContent=t; };
  renderPhone();
  if (!window.mqtt){ conn('Не загрузилась библиотека связи. Проверь интернет и обнови страницу'); return; }
  if (!(bi>=0 && bi<BROKERS.length)) bi=0;
  pClient = mqtt.connect(BROKERS[bi], {clientId:'hp'+Math.random().toString(36).slice(2,10), connectTimeout:8000, reconnectPeriod:2000, keepalive:20, clean:true});
  const hello=()=>{ if (myName && pClient.connected) pClient.publish(TOPIC(code)+'/up', JSON.stringify({k:'hello', id:myId, name:myName})); };
  pClient.on('connect', ()=>{ pClient.subscribe(TOPIC(code)+'/down/'+myId); hello(); });
  pClient.on('message', (topic, buf)=>{
    let d; try{ d=JSON.parse(buf.toString()); }catch(e){ return; }
    if (d.k==='st'){ pm=d.m; pmSeen=Date.now(); renderPhone(); }
  });
  pClient.on('error', ()=>{});
  window._hello=hello;
  setInterval(()=>{
    if (myName && pClient.connected) pClient.publish(TOPIC(code)+'/up', JSON.stringify({k:'hb', id:myId, name:myName}));
    if (!myName) conn('');
    else if (pmSeen && Date.now()-pmSeen<7000) conn('✅ Подключено к столу');
    else if (!pClient.connected) conn(`Подключаюсь к серверу ${bi+1}…`);
    else conn(pmSeen ? '⚠️ Нет связи со столом…' : 'Сервер ✓, ждём стол… Если долго — отсканируй QR заново');
  }, 2000);
}
function phoneJoin(){
  const n=$('pName').value.trim().slice(0,14);
  if (!n){ $('pName').focus(); return; }
  myName=n; try{ localStorage.setItem('hp_name', n); }catch(e){}
  pm=null; renderPhone();
  if (window._hello) window._hello();
}

// ================== Запуск ==================
if (UI){
  $('bFold').onclick = ()=>doAction('fold');
  $('bCall').onclick = ()=>doAction('call');
  $('bRaise').onclick = ()=>doAction('raise', raiseVal());
  $('bNext').onclick = ()=>{
    if (PHONE){ if (pm && pm.pre) return phoneSend('start'); if (pm && pm.gameEnded) return phoneSend('new'); return phoneSend('next'); }
    doAction('next');
  };
  $('bSkip').onclick = ()=>{ if (toAct>=0 && P[toAct].pid && !online(P[toAct].pid)) act(toAct, curBet-P[toAct].bet>0?'fold':'call'); };
  $('rng').oninput = ()=>{ $('num').value=$('rng').value; updRaiseLabel(); };
  $('num').oninput = ()=>{ $('rng').value=$('num').value; updRaiseLabel(); };
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.p; let v;
    if (f==='all') v=cm.maxTo; else v=cm.cb+Math.round(+f*(cm.pot+cm.call));
    v=Math.max(cm.minTo, Math.min(v, cm.maxTo));
    $('num').value=v; $('rng').value=v; updRaiseLabel();
  });
  // стол
  $('bNew').onclick = ()=>backToLobby();
  $('showAll').onchange = render;
  $('bPhone').onclick = ()=>{ $('qrPanel').classList.add('on'); drawQR(); renderLobby(); };
  $('bQrClose').onclick = ()=>$('qrPanel').classList.remove('on');
  $('bStart').onclick = ()=>startGame();
  $('botsSel').onclick = e=>{ const b=e.target.dataset && e.target.dataset.b; if (b===undefined) return; botsWanted=+b; try{ localStorage.setItem('hp_bots', botsWanted); }catch(_){} renderLobby(); syncPhones(true); };
  // телефон
  $('bJoin').onclick = phoneJoin;
  $('pName').onkeydown = e=>{ if (e.key==='Enter') phoneJoin(); };
  $('bRename').onclick = ()=>{ myName=''; renderPhone(); $('pName').focus(); };
  const tog=(k,ls)=>{ HINT[k]=!HINT[k]; try{ localStorage.setItem(ls, HINT[k]?'1':'0'); }catch(e){} paintToggles(); if (pm && !pm.pre && !pm.full) renderPhone(); };
  $('tCombo').onclick=()=>tog('combo','hp_combo');
  $('tEq').onclick=()=>tog('eq','hp_eq');
  const vtog=(k,ls)=>{ VIEW[k]=!VIEW[k]; try{ localStorage.setItem(ls, VIEW[k]?'1':'0'); }catch(e){} paintToggles(); if (pm && !pm.pre && !pm.full) renderPhone(); };
  $('tHideCards').onclick=()=>vtog('cards','hp_hcards');
  $('tHideTable').onclick=()=>vtog('table','hp_htable');
  const ph=$('pHand');
  const peekOn=e=>{ if (!VIEW.cards) return; e.preventDefault(); peek=true; if (pm && !pm.pre) renderPhone(); };
  const peekOff=()=>{ if (!peek) return; peek=false; if (pm && !pm.pre) renderPhone(); };
  ph.addEventListener('pointerdown', peekOn);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>ph.addEventListener(ev, peekOff));
  window.addEventListener('pointerup', peekOff);
  ph.addEventListener('contextmenu', e=>e.preventDefault());
  paintToggles();

  const m = location.hash.match(/^#p-([a-z0-9]{4,8})(?:-(\d))?$/);
  ['actRow','raiseRow','bNext'].forEach(id=>$(id).style.display='none');
  if (m) initPhone(m[1], +(m[2]||0));
  else { $('qrPanel').classList.add('on'); initTable(); }
}
